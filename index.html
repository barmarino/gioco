<style>
:root {
--bg: #f2f4f8; --surface: #ffffff; --ink: #17203a; --muted: #586181; --line: #d5dae6;
--blue: #1d4e9e; --blue-soft: #e4ebf8; --on-blue: #ffffff;
--lemon: #f2c230; --lemon-ink: #2e2400;
--good: #22764a; --bad: #ad3528;
--paper: #fffef7; --paper-line: #cec7b3;
--tile-blue: #1d4e9e; --tile-ground: #f6f1e4;
--f-display: "Bodoni Moda", "Bodoni 72", Didot, Georgia, serif;
--f-body: "Karla", "Helvetica Neue", Arial, sans-serif;
--f-mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
--bg: #0d1322; --surface: #151d31; --ink: #e7ebf5; --muted: #9ba4be; --line: #29334f;
--blue: #8aaeef; --blue-soft: #1c2948; --on-blue: #0d1322;
--lemon: #f2c230; --lemon-ink: #2e2400;
--good: #72c99a; --bad: #f08476;
--paper: #1a2337; --paper-line: #3a4565;
--tile-blue: #2c5cb3; --tile-ground: #0d1322; color-scheme: dark; } }
:root[data-theme="dark"] {
--bg: #0d1322; --surface: #151d31; --ink: #e7ebf5; --muted: #9ba4be; --line: #29334f;
--blue: #8aaeef; --blue-soft: #1c2948; --on-blue: #0d1322;
--lemon: #f2c230; --lemon-ink: #2e2400;
--good: #72c99a; --bad: #f08476;
--paper: #1a2337; --paper-line: #3a4565;
--tile-blue: #2c5cb3; --tile-ground: #0d1322; color-scheme: dark; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.5; }
.tiles { height: 26px; background-color: var(--tile-blue);
background-image:
radial-gradient(circle at 50% 50%, var(--lemon) 0 3.5px, transparent 4px),
radial-gradient(circle at 0 0, var(--tile-ground) 0 9px, transparent 9.5px),
radial-gradient(circle at 100% 0, var(--tile-ground) 0 9px, transparent 9.5px),
radial-gradient(circle at 0 100%, var(--tile-ground) 0 9px, transparent 9.5px),
radial-gradient(circle at 100% 100%, var(--tile-ground) 0 9px, transparent 9.5px);
background-size: 26px 26px; }
.wrap { max-width: 1040px; margin: 0 auto; padding-block: 24px 48px;
padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--f-display); text-wrap: balance; margin: 0; line-height: 1.1; }
h1 { font-size: clamp(2.4rem, 7vw, 3.6rem); font-style: italic; font-weight: 700; letter-spacing: -0.01em; }
h2 { font-size: clamp(1.6rem, 4.4vw, 2.1rem); font-weight: 600; }
h3 { font-size: 1.25rem; font-weight: 600; }
p { margin: 0; }
.kicker { font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); font-weight: 700; }
.mono, .num { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.stack { display: flex; flex-direction: column; gap: 16px; }
.intro { max-width: 680px; display: flex; flex-direction: column; gap: 22px; }
.intro .lede { font-size: 1.15rem; }
.rules { display: grid; gap: 10px; padding: 0; margin: 0; list-style: none; }
.rules li { display: grid; grid-template-columns: 28px 1fr; gap: 10px; align-items: start; }
.rules li::before { content: ""; width: 14px; height: 14px; margin-top: 5px; border-radius: 3px; background: var(--blue); }
.start-sheet { border: 1px solid var(--line); border-radius: 12px; background: var(--surface); padding: 18px 20px; display: grid; gap: 12px; }
.start-sheet .row { display: flex; justify-content: space-between; gap: 12px; border-bottom: 1px dashed var(--line); padding-bottom: 8px; }
.start-sheet .row:last-child { border-bottom: 0; padding-bottom: 0; }
.start-sheet .row .num { white-space: nowrap; }
/* end-of-game table on phones: the outcome goes under the decision, so the amount column stays on screen */
.settle .mob { display: none; }
@media (max-width: 560px) { .settle .oc { display: none; } .settle .mob { display: block; } .settle .pending { white-space: normal; } .settle th, .settle td { padding: 8px; } }
.seed { display: flex; flex-wrap: wrap; align-items: end; gap: 12px; }
.seed label { display: grid; gap: 4px; font-size: 0.85rem; color: var(--muted); font-weight: 700; }
.seed input { font: 500 1rem var(--f-mono); width: 9rem; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.top { display: grid; gap: 14px; margin-bottom: 22px; }
.topline { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 10px 20px; }
.brand { font-family: var(--f-display); font-style: italic; font-weight: 700; font-size: 1.7rem; }
.weekline { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.prog { display: flex; gap: 4px; padding: 0; margin: 0; list-style: none; }
.prog li { width: 14px; height: 14px; border-radius: 3px; border: 1.5px solid var(--line); }
.prog li.done { background: var(--blue); border-color: var(--blue); }
.prog li.now { background: var(--lemon); border-color: var(--lemon-ink); }
.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; display: grid; gap: 2px; min-width: 0; }
.stat .k { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); font-weight: 700; }
.stat .v { font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-size: 1.15rem; font-weight: 600; overflow-wrap: anywhere; }
.stat.nw { border-color: var(--blue); box-shadow: inset 0 0 0 1px var(--blue); }
.v.neg { color: var(--bad); }
.stats.three { grid-template-columns: repeat(3, minmax(0, 1fr)); }
@media (max-width: 560px) { .stats.three { grid-template-columns: repeat(2, minmax(0, 1fr)); } .stats.three .stat.nw { grid-column: 1 / -1; } }
.board { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 24px; align-items: start; }
.event { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.event .text { font-size: 1.05rem; max-width: 62ch; }
.opts { display: grid; gap: 10px; border: 0; padding: 0; margin: 0; min-width: 0; }
.opt { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 12px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); cursor: pointer; }
.opt input { accent-color: var(--blue); width: 18px; height: 18px; margin: 3px 0 0; }
.opt .lab { font-weight: 700; }
.opt .sub { grid-column: 2; color: var(--muted); font-size: 0.95rem; }
.opt:has(input:checked) { border-color: var(--blue); background: var(--blue-soft); }
.opt:has(input:focus-visible) { outline: 3px solid var(--lemon); outline-offset: 2px; }
.opt.locked { cursor: default; }
.opt.locked:not(:has(input:checked)) { opacity: 0.55; }
.egv { grid-column: 2; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 6px; }
.egv .cell { border: 1px dashed var(--line); border-radius: 8px; padding: 6px 10px; display: grid; gap: 0; min-width: 0; }
.egv .cell .k { font-size: 0.78rem; color: var(--muted); }
.egv .cell .v { font-family: var(--f-mono); font-variant-numeric: tabular-nums; font-weight: 600; }
.spread { grid-column: 2; position: relative; height: 10px; margin-top: 8px; }
.spread::before { content: ""; position: absolute; left: 0; right: 0; top: 4px; height: 2px; background: var(--line); }
.spread .seg { position: absolute; top: 3px; height: 4px; background: var(--blue); border-radius: 2px; }
.spread .dot { position: absolute; top: 0; width: 10px; height: 10px; margin-left: -5px; border-radius: 50%; background: var(--blue); }
.actions { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.btn { font: 700 1rem var(--f-body); border-radius: 999px; padding: 12px 22px; border: 0; background: var(--blue); color: var(--on-blue); cursor: pointer; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; }
.btn.ghost { background: transparent; color: var(--blue); border: 1px solid var(--line); }
.btn:focus-visible, summary:focus-visible { outline: 3px solid var(--lemon); outline-offset: 2px; }
.diebox { display: flex; align-items: center; gap: 18px; padding: 16px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); flex-wrap: wrap; }
.diebox p { flex: 1 1 220px; min-width: 0; }
.die { width: 66px; height: 66px; flex: none; border-radius: 14px; background: var(--lemon); border: 2px solid var(--lemon-ink); display: grid; grid-template: repeat(3, 1fr) / repeat(3, 1fr); padding: 9px; box-shadow: 0 3px 0 var(--lemon-ink); }
.pip { width: 11px; height: 11px; border-radius: 50%; background: var(--lemon-ink); place-self: center; visibility: hidden; }
.pip.on { visibility: visible; }
.die.rolling { animation: wobble 0.12s linear infinite; }
@keyframes wobble { 0% { transform: rotate(-8deg); } 50% { transform: rotate(8deg); } 100% { transform: rotate(-8deg); } }
@media (prefers-reduced-motion: reduce) { .die.rolling { animation: none; } }
.outcome { border-left: 4px solid var(--lemon); padding: 10px 14px; background: var(--surface); border-radius: 0 10px 10px 0; display: flex; gap: 14px; align-items: center; }
.outcome .die { width: 44px; height: 44px; padding: 6px; border-radius: 10px; box-shadow: none; }
.outcome .pip { width: 7px; height: 7px; }
.receipt { background: var(--paper); border: 1px solid var(--paper-line); border-radius: 4px; padding: 18px 18px 14px; font-family: var(--f-mono); font-size: 0.86rem; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 16px); }
.receipt .rh { text-align: center; display: grid; gap: 2px; padding-bottom: 10px; border-bottom: 1px dashed var(--paper-line); margin-bottom: 8px; }
.receipt .rh b { letter-spacing: 0.18em; }
.receipt .line { display: flex; justify-content: space-between; gap: 12px; padding: 3px 0; }
.receipt .line span:first-child { min-width: 0; }
.receipt .line span:last-child { font-variant-numeric: tabular-nums; white-space: nowrap; }
.receipt .in span:last-child { color: var(--good); }
.receipt .fee { color: var(--bad); font-weight: 600; }
.receipt .info { color: var(--muted); }
.receipt .tot { border-top: 1px dashed var(--paper-line); margin-top: 8px; padding-top: 8px; font-weight: 600; }
.receipt .empty { color: var(--muted); }
details { border-top: 1px solid var(--line); margin-top: 28px; padding-top: 14px; }
summary { cursor: pointer; font-weight: 700; }
.past-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; margin-top: 14px; }
.past-list .receipt { position: static; }
.end { display: grid; gap: 22px; }
.bignum { font-family: var(--f-display); font-weight: 700; font-size: clamp(3rem, 12vw, 5.4rem); line-height: 1; font-variant-numeric: tabular-nums lining-nums; }
.bignum.neg { color: var(--bad); }
.endgrid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px; align-items: start; }
.choices { margin: 0; padding-left: 1.4em; display: grid; gap: 6px; }
.choices li span { color: var(--muted); }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: 0.9rem; }
th, td { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
tr:last-child td { border-bottom: 0; }
td.r, th.r { text-align: right; font-family: var(--f-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.tag { display: inline-block; font-size: 0.72rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; background: var(--blue-soft); color: var(--blue); white-space: nowrap; }
.tag.risk { background: var(--lemon); color: var(--lemon-ink); }
.metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
.note { font-size: 0.9rem; color: var(--muted); max-width: 72ch; }
textarea.json { width: 100%; min-height: 140px; font: 0.8rem var(--f-mono); background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 10px; box-sizing: border-box; }
@media (max-width: 860px) {
.board { grid-template-columns: minmax(0, 1fr); }
.receipt { position: static; }
.endgrid { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 560px) {
.stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.egv { grid-template-columns: minmax(0, 1fr); }
}
.prog { gap: 3px; flex-wrap: wrap; }
@media (max-width: 560px) { .prog li { width: 10px; height: 10px; } .prog li:nth-child(5n):not(:last-child) { margin-right: 6px; } }
.dlist .pending { align-self: start; }
.prog li:nth-child(5n):not(:last-child) { margin-right: 9px; }
.slot { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.slot .tag { font-size: 0.7rem; }
.recap { display: grid; gap: 26px; max-width: 760px; }
.recap section { display: grid; gap: 12px; }
.recap .story { display: grid; gap: 12px; }
.recap .story p { max-width: 64ch; }
.recap .story .wk { font-family: var(--f-mono); font-size: 0.78rem; color: var(--muted); display: block; margin-bottom: 2px; letter-spacing: 0.06em; text-transform: uppercase; }
.dlist { list-style: none; margin: 0; padding: 0; display: grid; gap: 0; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); }
.dlist li { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 16px; padding: 10px 14px; border-bottom: 1px solid var(--line); }
.dlist li:last-child { border-bottom: 0; }
.dlist .what { font-weight: 700; }
.dlist .how { grid-column: 1 / -1; color: var(--muted); font-size: 0.95rem; }
.dlist .when { font-family: var(--f-mono); font-size: 0.78rem; color: var(--muted); white-space: nowrap; align-self: start; padding-top: 2px; }
.pending { font-family: var(--f-mono); font-size: 0.72rem; font-weight: 600; padding: 2px 8px; border-radius: 999px; border: 1px dashed var(--muted); color: var(--muted); white-space: nowrap; }
.rcode { font: 600 clamp(1.1rem, 4.5vw, 1.5rem) var(--f-mono); letter-spacing: 0.06em; padding: 14px 18px; border: 2px dashed var(--blue); border-radius: 10px; background: var(--surface); overflow-wrap: anywhere; user-select: all; }
.resume { display: grid; gap: 10px; border-top: 1px solid var(--line); padding-top: 18px; }
.resume input { font: 500 1rem var(--f-mono); padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); width: min(100%, 26rem); box-sizing: border-box; }
.resume .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.err { color: var(--bad); font-size: 0.9rem; }
.weekend { display: grid; gap: 22px; max-width: 760px; }
.settle td.die-cell { width: 44px; }
.settle .die { width: 30px; height: 30px; padding: 4px; border-radius: 7px; box-shadow: none; border-width: 1.5px; }
.settle .pip { width: 5px; height: 5px; }
.settle td.pos { color: var(--good); }
.settle td.neg { color: var(--bad); }
.settle tfoot td { font-weight: 700; border-top: 1px solid var(--line); }
.bigdie { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
.panel td.c { text-align: center; font-family: var(--f-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.mini { font-size: 0.78rem; color: var(--muted); display: block; }
.seed select { font: 500 1rem var(--f-body); padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
.dlist li.orow { grid-template-columns: 40px minmax(0, 1fr); align-items: start; }
.dlist li.orow .die { grid-row: span 2; width: 34px; height: 34px; padding: 5px; border-radius: 8px; box-shadow: none; border-width: 1.5px; }
.dlist li.orow .pip { width: 6px; height: 6px; }
.dlist li.orow .how { grid-column: 2; }
.dlist .how b.num { white-space: nowrap; }
.dlist .choice { font-weight: 400; color: var(--muted); }
.settle tr.paid td, .settle tr.flash td { background: var(--blue-soft); }
.settle tr.paid td:first-child { font-weight: 700; }
.drawbox { display: flex; gap: 16px; align-items: center; flex-wrap: wrap; padding: 16px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); }
.drawbox p { flex: 1 1 220px; min-width: 0; }
/* ---- server version: login, locked weeks, save status, researcher panel ---- */
.login { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; margin: 0; }
.login label { display: grid; gap: 4px; font-size: 0.85rem; color: var(--muted); font-weight: 700; }
.login input { font: 600 1.4rem var(--f-mono); letter-spacing: 0.14em; text-transform: uppercase; width: 10rem; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); box-sizing: border-box; }
.codes { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: grid; gap: 0; text-align: left; font: 600 0.95rem var(--f-mono); letter-spacing: 0.06em; padding: 8px 12px; border-radius: 10px; border: 1px dashed var(--blue); background: var(--surface); color: var(--blue); cursor: pointer; }
.chip .mini { font-family: var(--f-body); letter-spacing: 0; font-weight: 500; }
.chip:focus-visible, .linkbtn:focus-visible, .foot a:focus-visible { outline: 3px solid var(--lemon); outline-offset: 2px; }
.lock { display: grid; gap: 18px; max-width: 640px; }
.foot { margin-top: 36px; padding-top: 12px; border-top: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 6px 18px; align-items: center; font-size: 0.85rem; color: var(--muted); }
.foot:empty { display: none; }
.foot .fam { font-family: var(--f-mono); color: var(--ink); letter-spacing: 0.06em; }
.foot a { color: var(--blue); }
.sync.ok { color: var(--good); }
.sync.warn { color: var(--bad); }
.linkbtn { background: none; border: 0; padding: 0; font: inherit; color: var(--blue); text-decoration: underline; cursor: pointer; }
.rpanel { display: grid; gap: 22px; }
.rpanel table td, .rpanel table th { white-space: nowrap; }
.rpanel td.code { font-family: var(--f-mono); font-weight: 600; letter-spacing: 0.06em; }
.prog-bar { display: inline-block; vertical-align: middle; width: 72px; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; margin-right: 8px; }
.prog-bar span { display: block; height: 100%; background: var(--blue); }
.btn.small { padding: 6px 12px; font-size: 0.85rem; }
.btn.danger { background: var(--bad); color: #fff; }
.cal { display: grid; gap: 6px; }
.adminin { font: 500 1rem var(--f-body); padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); }
textarea.csv { width: 100%; min-height: 160px; font: 0.78rem var(--f-mono); background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 8px; padding: 10px; box-sizing: border-box; }
</style>
</head>
<body>
<div class="tiles" aria-hidden="true"></div>
<div class="wrap">
<main id="app"></main>
<footer id="foot" class="foot"></footer>
</div>

const Sync = { state: '', busy: false, dirty: false, tries: 0, timer: null };
async function sync() {

  const code = G.code, doc = gameDoc();
  try {

    Sync.tries = 0; clearTimeout(Sync.timer);
    if (res && res.ok === false && res.reason === 'behind' && code === G.code) { Sync.busy = false; adoptServer(res.game); return; }
    setSync(Sync.dirty ? 'saving' : 'ok');
  } catch (e) {
    Sync.dirty = true;
    // 28000: code no longer valid; 22023: the server refused this game (week not open, too large). Retrying cannot help.
    if (e && (e.code === '28000' || e.code === '22023')) { setSync('denied'); Sync.busy = false; return; }

      <td class="r">${v.scores ? `${fmt(v.scores.fin)}<span class="mini">expected ${fmt(v.scores.exp)}</span>` : '—'}</td>
      <td>${v.g ? (PANEL.arm === v.f.code ? `<button class="btn small danger" data-act="reset-ok" data-code="${esc(v.f.code)}">Confirm</button> <button class="btn small ghost" data-act="reset-no">No</button>` : `<button class="btn small ghost" data-act="reset" data-code="${esc(v.f.code)}">Reset</button>`) : ''}</td>
    </tr>`).join('');
  const cal = Object.entries(PANEL.schools).map(([id, s]) => `<div><b>${esc(id)}</b> · ${(s.opening_dates || []).map((d, i) => `week ${i + 1}: ${new Date(d + 'T12:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short' })}`).join(' · ')}</div>`).join('');
  return `<section class="rpanel">
    <div class="stack" style="gap:8px"><p class="kicker">Research team only</p><h2>Researcher panel</h2></div>
    <p class="note">The game database holds no treatment arm: merge the CSVs with the assignment file on the family code. Net worth and dice are recomputed from the choices and the family’s dice code, not taken from the phone. Times in the CSVs are UTC (one hour behind Italy in winter).</p>
    <div class="metrics">${stat('Families', n.tot)}${stat('Entered', n.in)}${stat('In progress', n.run)}${stat('Completed', n.done)}</div>
    ${PANEL.err ? `<p class="err" role="alert">${PANEL.err}</p>` : ''}
    ${PANEL.loading && !PANEL.fams.length ? '<p class="muted" role="status">Loading…</p>' : `<div class="tablewrap"><table>
      <thead><tr><th>Code</th><th>School</th><th>Dice · seed</th><th>Decisions</th><th>Status</th><th>Last activity</th><th class="r">Net worth</th><th></th></tr></thead>
      <tbody>${rows}</tbody></table></div>`}
    <div class="actions"><button class="btn small ghost" data-act="refresh">Refresh</button><span class="muted">${PANEL.at ? 'Updated at ' + PANEL.at.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' }) + ' · refreshes every minute' : ''}</span></div>
    <p class="note">“Reset” deletes the game on the server and the copies saved on phones, so the code can be played again from the start.</p>
    <div class="actions">
      <button class="btn" data-act="csv" data-kind="decisions">Download CSV · one row per decision</button>
      <button class="btn ghost" data-act="csv" data-kind="families">Download CSV · one row per family</button>
      <span class="muted" role="status">${PANEL.msg}</span>
    </div>
    <div class="stack" style="gap:8px"><h3>School calendars</h3><div class="cal note">${cal || '—'}</div></div>
    <div class="actions"><button class="btn ghost" data-act="to-game">Back to the game</button><button class="btn ghost" data-act="admin-out">Sign out</button><span class="muted">${esc(Store.email)}</span></div>
  </section>`;
}
function saveFile(name, text) {
  const url = URL.createObjectURL(new Blob([text], { type: 'text/csv;charset=utf-8' }));
  const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
function downloadCsv(kind) {
  const csv = toCsv(kind === 'decisions' ? decisionRows() : familyRows());
  if (!csv) { PANEL.msg = 'No data yet.'; render(); return; }
  saveFile(`bar-marino-${kind}-${new Date().toISOString().slice(0, 10)}.csv`, csv);
  PANEL.msg = ''; render();
}
async function adminLogin(email, pw) {
  PANEL.email = email;
  if (!email || !pw) { PANEL.err = 'Enter email and password.'; render(); return; }
  PANEL.busy = true; PANEL.err = ''; render();
  try {
    await withTimeout(Store.signIn(email.trim(), pw), 15000);
    PANEL.busy = false;
    try { TEST = await withTimeout(Store.allFamilies(), 12000); } catch (_) { TEST = []; }
    openPanel();
  } catch (e) {
    PANEL.busy = false; PANEL.err = e && e.code === 'timeout' ? 'The server is not answering.' : 'Wrong email or password.'; render();
  }
}

// ===== RENDER & ACTIONS =====
const route = () => (location.hash === '#panel' || location.hash === '#pannello') ? 'panel' : 'game';
function render() {
  const app = document.getElementById('app');
  if (route() === 'panel') { app.innerHTML = renderPanel(); renderFoot(); return; }
  if (G.screen === 'play' && G.tFor !== G.i) { G.tFor = G.i; G.t0 = Date.now(); G.nSel = 0; }
  app.innerHTML = (G.notice ? `<p class="err" role="status" style="margin-bottom:16px">${esc(G.notice)}</p>` : '') + { login: renderLogin, intro: renderIntro, locked: renderLocked, closed: renderClosed, play: renderPlay, shock: renderShock, weekend: renderWeekend, recap: renderRecap, end: renderEnd }[G.screen]();
  renderFoot();
}
function renderFoot() {
  const el = document.getElementById('foot');
  if (!el) return;
  if (route() === 'panel') { el.innerHTML = ''; return; }
  const parts = [];
  if (G.code) parts.push(`<span>Famiglia <span class="fam">${esc(G.code)}</span></span>`);
  const msg = { saving: 'Salvataggio…', ok: '✓ Salvato sul server', retry: 'Non ancora salvato: manca la connessione? Riprovo da solo.', denied: 'Il server non accetta questa partita. Avvisate la scuola.' }[Sync.state];
  if (G.code && msg) parts.push(`<span class="sync ${Sync.state === 'ok' ? 'ok' : Sync.state === 'retry' || Sync.state === 'denied' ? 'warn' : ''}" role="status">${msg}</span>${Sync.state === 'retry' ? '<button class="linkbtn" data-act="retry-sync">Riprova ora</button>' : ''}`);
  if (!G.code && G.screen !== 'login') parts.push('<span class="sync warn">Senza server: la partita non viene salvata.</span>');
  if (!['login', 'closed', 'locked'].includes(G.screen)) parts.push('<button class="linkbtn" data-act="logout">Esci</button>');
  if (Store.isAdmin) parts.push('<a href="#panel">Researcher panel</a>');
  el.innerHTML = parts.join('');
}
const top0 = () => window.scrollTo({ top: 0 });
const calm = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
function copyText(txt, msgId, fallbackEl) {
  const msg = document.getElementById(msgId);
  const fallback = () => { if (fallbackEl) fallbackEl(); if (msg) msg.textContent = 'Selezionate il testo e copiatelo.'; };
  try { navigator.clipboard.writeText(txt).then(() => { if (msg) msg.textContent = 'Copiato.'; }, fallback); } catch (_) { fallback(); }
}
function rollAnim(done) {
  const die = document.querySelector('.bigdie .die');
  if (!die || calm()) return done();
  die.classList.add('rolling');
  const pips = die.querySelectorAll('.pip');
  let n = 0;
  const t = setInterval(() => {
    const f = 1 + Math.floor(Math.random() * 6);
    pips.forEach((p, i) => p.classList.toggle('on', FACES[f].includes(i)));
    if (++n >= 12) { clearInterval(t); done(); }
  }, 75);
}
// Time on a decision counts only while the page is visible
document.addEventListener('visibilitychange', () => {
  if (document.hidden) G.hiddenAt = Date.now();
  else if (G.hiddenAt) { if (G.t0) G.t0 += Date.now() - G.hiddenAt; G.hiddenAt = 0; }
});
document.addEventListener('change', e => {
  if (e.target.name === 'opt' && G.screen === 'play') { G.sel = e.target.value; G.nSel = (G.nSel || 0) + 1; const b = document.getElementById('confirmBtn'); if (b) b.disabled = false; }
});
document.addEventListener('submit', e => {
  if (e.target.id === 'loginForm') { e.preventDefault(); if (!G.busy) login(document.getElementById('codeInput').value); }
  if (e.target.id === 'adminForm') { e.preventDefault(); if (!PANEL.busy) adminLogin(document.getElementById('adminEmail').value, document.getElementById('adminPw').value); }
});
function addShown(ids) {
  const fresh = ids.filter(id => !G.shown.includes(id));
  G.shown = [...G.shown, ...fresh];
  logDice(fresh);
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act;
  if (G.notice && act !== 'fill-code') G.notice = '';
  if (act === 'fill-code') {
    const inp = document.getElementById('codeInput'); if (inp) { inp.value = b.dataset.code; inp.focus(); }
  } else if (act === 'offline') {
    newGame(1, false, null); G.screen = 'intro'; render(); top0();
  } else if (act === 'start') {
    G.started = G.started || nowISO(); logEv('week_start', { week: 1 });
    G.screen = 'play'; sync(); render(); top0();
  } else if (act === 'confirm' && G.sel) {
    const id = idxOf(G.i), secs = G.t0 ? Math.round((Date.now() - G.t0) / 100) / 10 : null;
    G.choices[id] = G.sel;
    logEv('choice', { n: G.i + 1, decision: VAR[id], week: WEEK_OF[id], type: KTYPE[KIND[id]], option: dsNum(id, G.sel), option_label: dsLabel(id, G.sel), seconds: secs, selections: G.nSel || 1 });
    G.i += 1; G.sel = null;
    G.screen = G.i === 20 ? 'end' : G.i % 5 === 4 ? 'shock' : G.i % 5 === 0 ? 'weekend' : 'play';
    sync(); render(); top0();
  } else if (act === 'close-session') {
    logEv('session_end', { week: G.i / 5 });
    G.screen = 'closed'; sync(); render(); top0();
  } else if (act === 'go-recap') {
    G.screen = isOpen(G.i / 5 + 1) ? 'recap' : 'locked'; render(); top0();
  } else if (act === 'begin-week') {
    const w = G.i / 5 + 1;
    if (!isOpen(w)) { G.screen = 'locked'; render(); top0(); return; }
    logEv('week_start', { week: w });
    G.screen = 'play'; sync(); render(); top0();
  } else if (act === 'roll-shock') {
    b.disabled = true;
    rollAnim(() => { addShown([shockOf(weekOfIdx(G.i))]); sync(); render(); });
  } else if (act === 'continue') {
    G.screen = 'play'; render(); top0();
  } else if (act === 'roll-week') {
    b.disabled = true;
    rollAnim(() => { addShown(weekRisk(G.i / 5)); sync(); render(); });
  } else if (act === 'roll') {
    b.disabled = true;
    rollAnim(() => {
      addShown([...RISK_IDS]); cache = null;
      logEv('game_end', { net_worth: finalScore(G.choices, G.dice) });
      sync(); render();
    });
  } else if (act === 'logout') {
    logout();
  } else if (act === 'retry-sync') {
    Sync.tries = 0; sync();
  } else if (act === 'to-game') {
    location.hash = '';
  } else if (act === 'reset') {
    PANEL.arm = b.dataset.code; render();
  } else if (act === 'reset-no') {
    PANEL.arm = null; render();
  } else if (act === 'reset-ok') {
    const code = b.dataset.code; b.disabled = true;
    Store.resetGame(code).then(() => { PANEL.arm = null; PANEL.msg = `Game ${code} reset.`; return loadPanel(); })
      .catch(() => { PANEL.arm = null; PANEL.msg = 'Could not reset the game.'; render(); });
  } else if (act === 'refresh') {
    b.disabled = true; loadPanel();
  } else if (act === 'admin-out') {
    closePanel(); Store.signOut().then(() => { TEST = []; PANEL.fams = []; PANEL.games = {}; render(); });
  } else if (act === 'csv') {
    downloadCsv(b.dataset.kind);
  } else if (act === 'copy-csv') {
    copyText(PANEL.csv, 'csvMsg', () => { const ta = document.querySelector('textarea.csv'); if (ta) { ta.focus(); ta.select(); } });
  }
});
window.addEventListener('hashchange', () => { if (route() === 'panel') openPanel(); else { closePanel(); render(); } top0(); });

async function boot() {
  const h = location.hash.slice(1), f = new URLSearchParams(location.search).get('f') || '';
  if (/^[A-Za-z0-9]{4,10}$/.test(f)) G.prefill = normCode(f);                                   // personal link: …/?f=K7P3A
  else if (/^[A-Za-z0-9]{4,10}$/.test(h) && !['panel', 'pannello'].includes(h)) G.prefill = normCode(h);       // or …/#K7P3A
  else G.prefill = lastCode();
  render();
  await Store.init();
  if (Store.isAdmin && Store.db) { try { TEST = await withTimeout(Store.allFamilies(), 12000); } catch (_) { TEST = []; } }
  if (route() === 'panel') openPanel(); else render();
}
boot();
</script>
